server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: sustentacao-backend

  datasource:
    url: ${DB_URL:jdbc:h2:mem:sustentacaodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driverClassName: org.h2.Driver
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Configuração do JWT usando Variável de Ambiente
jwt:
  secret: ${JWT_SECRET:MinhaChaveSecretaSuperSeguraComMaisDe32Caracteres123456}
  expiration: 86400000